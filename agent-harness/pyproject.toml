[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-web-jike"
version = "0.1.1"
description = "Agent-native CLI for Jike (即刻) — interact with web.okjike.com from the terminal"
readme = { file = "cli_web/jike/README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [{ name = "doublewater777" }]
keywords = ["jike", "即刻", "cli", "social-media", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx>=0.24",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
auth = ["playwright>=1.30"]

[project.scripts]
cli-web-jike = "cli_web.jike.jike_cli:main"

[tool.setuptools.packages.find]
include = ["cli_web.*"]
